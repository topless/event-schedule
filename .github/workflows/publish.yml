name: Build feeds

on:
  schedule:
    - cron: '23 4 * * *' # daily; GitHub may start it hours late
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the run commits src/known-games.json back to main (last step)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      # A failed fetch stops here, so the last published calendars stay online.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
      # The build records the games it saw in src/known-games.json, so the next run can tell a newly
      # announced game from an old one (the -alerts feeds). Commit it back when it changed. A push made
      # with GITHUB_TOKEN starts no workflow run, so this cannot loop, and the concurrency group above
      # keeps two runs from racing. Runs after the deploy, so a failed push never holds the feeds back.
      - name: Record newly seen games
        run: |
          git diff --quiet -- src/known-games.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/known-games.json
          git commit -m 'chore(data): record newly seen games' -m '- Remembers the games this run saw, so the next run can tell a new announcement from an old game'
          git pull --rebase origin main # main may have moved since the checkout
          git push origin HEAD:main
