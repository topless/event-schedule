name: Build feeds

on:
  schedule:
    - cron: '23 4 * * *' # daily; GitHub may start it hours late
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      # A failed fetch stops here, so the last published calendars stay online.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          CANONICAL_HOST: ${{ vars.CANONICAL_HOST }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
